apiVersion: apps/v1
kind: Deployment
metadata:
  name: solr-deployment-
  namespace: 85c8a741-63c7-438b-8abe-9fe23efa41e5
  labels:
    app: solr-
spec:
  replicas: 1
  selector:
    matchLabels:
      app: solr-
  template:
    metadata:
      labels:
        app: solr-
    spec:
      initContainers:
        - name: fix-permissions
          image: ravi8881/85c8a741-63c7-438b-8abe-9fe23efa41e5-ravisuborg1-ravidevenv-9dd0c8bf-0a27-4293-9442-db5b86a7c07f:17.0.0
          command: 
            - sh
            - '-c'
            - |
              echo "Copying initial Solr data from image to PVC..."
              mkdir -p /data/9dd0c8bf-0a27-4293-9442-db5b86a7c07f/ /data/9dd0c8bf-0a27-4293-9442-db5b86a7c07f/data
              cp -R /var/solr/data/* /data/9dd0c8bf-0a27-4293-9442-db5b86a7c07f/ || true
              cp -R /var/solr/move/* /data/9dd0c8bf-0a27-4293-9442-db5b86a7c07f/data || true
              chown -R 8983:8983 /data
              chmod -R 777 /data
              echo "Done copying Solr cores."
          volumeMounts:
            - name: solr-data-volume
              mountPath: /data
          securityContext:
            runAsUser: 0 # Run as root to change ownership

      containers:
        - name: solr-
          image: ravi8881/85c8a741-63c7-438b-8abe-9fe23efa41e5-ravisuborg1-ravidevenv-9dd0c8bf-0a27-4293-9442-db5b86a7c07f:17.0.0
          ports:
            - containerPort: 8983
          env:
            - name: SOLR_OPTS
              value: "-Dsolr.allowPaths=/data"  
          volumeMounts:
            - name: solr-data-volume
              mountPath: /data # This path is where Solr looks for its cores
      volumes:
        - name: solr-data-volume
          persistentVolumeClaim:
            claimName: 9dd0c8bf-0a27-4293-9442-db5b86a7c07f # This name must match the PVC metadata.name
      securityContext:
        runAsUser: 8983
        runAsGroup: 8983
        fsGroup: 8983